<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: $GODOT_SPLASH_COLOR;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

#bc-fs-btn {
	position: fixed;
	right: 10px;
	bottom: 10px;
	z-index: 1000;
	min-width: 44px;
	min-height: 44px;
	padding: 0 14px;
	border: 1px solid rgba(255, 255, 255, 0.4);
	border-radius: 8px;
	background: rgba(0, 0, 0, 0.45);
	color: #ffffff;
	font: 600 14px/1 system-ui, sans-serif;
	opacity: 0.55;
	touch-action: manipulation;
	-webkit-tap-highlight-color: transparent;
}

#bc-fs-btn:active {
	opacity: 0.9;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<button id="bc-fs-btn" type="button" aria-label="Toggle fullscreen">Fullscreen</button>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const fsBtn = document.getElementById('bc-fs-btn');

	let initializing = true;
	let statusMode = '';

	// --- Boothcamp shell additions: fullscreen toggle + mobile resize fix ---
	// The engine only re-measures the canvas on window resize. Mobile browsers
	// settle their viewport (URL bar, orientation) AFTER the game starts, so the
	// initial canvas geometry is stale until a resize happens. Re-syncing the
	// canvas CSS size and re-firing resize once things settle fixes both the
	// rendering area and touch mapping. canvasResizePolicy stays 2 ("Project"):
	// the engine's own resize path computes correct geometry once it runs.

	function bcSyncCanvas() {
		const canvas = document.getElementById('canvas');
		if (canvas) {
			const w = window.innerWidth;
			const h = window.innerHeight;
			if (canvas.style.width !== w + 'px' || canvas.style.height !== h + 'px') {
				canvas.style.width = w + 'px';
				canvas.style.height = h + 'px';
			}
		}
		window.dispatchEvent(new Event('resize'));
	}

	function bcKick(delays) {
		delays.forEach(function (d) {
			setTimeout(bcSyncCanvas, d);
		});
	}

	window.addEventListener('orientationchange', function () {
		bcKick([0, 300, 800]);
	});

	if (window.visualViewport) {
		let bcVvTimer = null;
		window.visualViewport.addEventListener('resize', function () {
			if (bcVvTimer) {
				clearTimeout(bcVvTimer);
			}
			bcVvTimer = setTimeout(bcSyncCanvas, 150);
		});
	}

	// Safety net: if nothing fired before the first interaction, sync then.
	window.addEventListener('pointerdown', bcSyncCanvas, { once: true });

	const fsTarget = document.documentElement;
	const fsRequest = fsTarget.requestFullscreen || fsTarget.webkitRequestFullscreen;
	const fsExit = document.exitFullscreen || document.webkitExitFullscreen;

	function bcFsActive() {
		return document.fullscreenElement || document.webkitFullscreenElement;
	}

	function bcFsUpdate() {
		fsBtn.textContent = bcFsActive() ? 'Exit full' : 'Fullscreen';
	}

	if (!fsRequest) {
		fsBtn.style.display = 'none';
	} else {
		fsBtn.addEventListener('click', function () {
			if (bcFsActive()) {
				try {
					fsExit.call(document);
				} catch (e) { /* ignore */ }
			} else {
				try {
					const p = fsRequest.call(fsTarget, { navigationUI: 'hide' });
					if (p && p.catch) {
						p.catch(function () { /* denied or unsupported */ });
					}
				} catch (e) { /* unsupported on this browser */ }
			}
		});
		document.addEventListener('fullscreenchange', function () {
			bcFsUpdate();
			bcKick([0, 120]);
		});
		document.addEventListener('webkitfullscreenchange', function () {
			bcFsUpdate();
			bcKick([0, 120]);
		});
	}
	// --- end Boothcamp shell additions ---

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
			// Mobile viewports settle after startup; re-measure on a short ladder.
			bcKick([0, 150, 500, 1200]);
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
